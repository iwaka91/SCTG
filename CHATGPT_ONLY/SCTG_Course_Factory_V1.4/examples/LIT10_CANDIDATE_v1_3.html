function confirmAction(title,msg,callback){modal(title,`<p>${esc(msg)}</p>`,`<button class="btn secondary" data-action="close-modal">Batal</button><button id="confirmYes" class="btn danger">Ya, lanjutkan</button>`);$('#confirmYes').onclick=()=>{closeModal();callback()}}
const isStage=()=>matchMedia('(orientation:landscape) and (min-width:900px) and (min-height:500px)').matches;
function setAppearance(){document.documentElement.dataset.theme=P.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):P.theme;document.documentElement.style.setProperty('--font',[1,1.1,1.2][P.font]||1);$('#soundBtn').textContent=P.sound?'🔊':'🔇'}
function show(n,{silent=false,force=false}={}){if(!logged&&n!==1)return;if(!force&&!fast()&&n>S.max){toast('Selesaikan langkah sebelumnya dahulu');return}save();view=n;if(n!==1||logged||!S.identity)S.step=n;document.body.classList.toggle('cover-mode',n===1);$$('.step').forEach(x=>x.hidden=Number(x.dataset.step)!==n);$('#hdr').hidden=n===1;$('#view').scrollTop=0;$('#stepLabel').textContent=`${n}/10 · ${ICON[n]} ${NAMES[n]}`;$('#who').textContent=S.identity?`${S.identity.name} · ${S.identity.kelas}`:'Perjalanan Belajar';$('#progressLine').style.width=`${Math.round((n-1)/9*100)}%`;closeDrawer(false);stopSpeak();readingCurrent=null;renderStep(n);if(!silent&&n===2&&!S.intro.tp)playCinema('tp');if(!silent&&n===7&&!S.intro.boss)playCinema('boss');updateMenu();startDraw();save()}
function complete(n){S.done[n]=true;S.max=Math.max(S.max,Math.min(10,n+1));save();updateMenu()}
function nextButton(n,ready=true){return `<div class="footnav"><button class="btn wide" id="nextBtn" data-action="next" data-from="${n}" ${ready?'':'disabled'}>Lanjut ke ${esc(NAMES[n+1]||'Selesai')} →</button></div>`}
function next(n){if(n<10&&!S.done[n]){toast('Selesaikan tantangan langkah ini terlebih dahulu');return}audio('next');show(n+1)}
function updateMenu(){let s='';for(let i=1;i<=10;i++){const st=S.done[i]?'✅':i<=S.max||fast()?'▶':'🔒';s+=`<button class="draweritem ${i===view?'active':''}" data-action="jump" data-step="${i}"><span style="font-size:1.4rem">${ICON[i]}</span><span style="flex:1"><b>${i}. ${NAMES[i]}</b><small>${st} ${S.done[i]?'Selesai':i<=S.max||fast()?'Dapat dibuka':'Terkunci'}</small></span></button>`}$('#drawerlist').innerHTML=s;$('#drawerProgress').textContent=`${Object.keys(S.done).length}/10 Langkah Belajar selesai`}
function openMenu(){openDrawer=true;$('#drawer').classList.add('open');$('#overlay').classList.add('on');stopDraw()}
function closeDrawer(redraw=true){openDrawer=false;$('#drawer').classList.remove('open');$('#overlay').classList.remove('on');if(redraw)startDraw()}
function applyGate(id,items,confirm){const g=S.gates[id]||={index:0,records:[],confirmed:false};while(g.records.length<items.length)g.records.push(null);const done=g.records.filter(r=>r?.done).length;let html=`<div class="gate" data-gate="${id}"><div class="eyebrow">Gerbang Baca · ${done}/${items.length}</div><div class="gateprogress"><i style="width:${done/items.length*100}%"></i></div><div class="gateshell ${readingCurrent?.id===id?'reading':''}"><div class="gatelist">`;
items.forEach((it,i)=>{let rec=g.records[i],open=readingCurrent?.id===id&&readingCurrent.i===i,allowed=i===0||g.records[i-1]?.done;let state=rec?.done?'✅':open?'⏳':allowed?'▶':'🔒';html+=`<div class="gateentry"><button class="gatepick" data-action="read" data-gate="${id}" data-idx="${i}"><span class="gico">${it.icon}</span><span class="gdesc"><b>${esc(it.name)}</b><small>${esc(i+1+' dari '+items.length)} · ${state}</small></span><b>${state}</b></button>${open?`<div class="readingbody"><div>${it.content}</div><span class="small muted" data-gate-timer="${id}-${i}">${rec?.done?'✅':Math.ceil(rec?.remaining??secs(it.content))+' dtk'}</span><button class="btn secondary gateaction" data-action="readnext" data-gate="${id}" data-idx="${i}" ${rec?.done?'':'disabled'}>${i===items.length-1?'Selesai Membaca':`Lanjut ke ${esc(items[i+1].name)} →`}</button></div>`:''}</div>`});
html+=`<div class="gatecontrol"><label><input type="checkbox" data-action="confirm-read" data-gate="${id}" ${done===items.length?'':'disabled'} ${g.confirmed?'checked':''}> ${esc(confirm)}</label></div></div><div class="gateright">`;
if(readingCurrent?.id===id){let i=readingCurrent.i,it=items[i],rec=g.records[i];html+=`<div class="rightheader"><b style="color:var(--gold2)">${it.icon} ${esc(it.name)}</b><span data-gate-timer="${id}-${i}">${rec?.done?'✅':Math.ceil(rec?.remaining??secs(it.content))+' dtk'}</span><button class="btn secondary smallbtn readclose" data-action="readclose">✕</button></div><div class="rightbody">${it.content}</div><div class="rightfoot"><button class="btn wide" data-action="readnext" data-gate="${id}" data-idx="${i}" ${rec?.done?'':'disabled'}>${i===items.length-1?'Selesai Membaca':`Lanjut ke ${esc(items[i+1].name)} →`}</button></div>`}
html+='</div></div></div>';return html}
const gates={tp:[...TP.map((t,i)=>({icon:['🎯','🔎','📜'][i],name:`TP ${i+1}`,content:`<p>${esc(t)}</p>`})),{icon:'✉️',name:'Situasi Misi',content:'<p>Sebuah memo bersegel mengumumkan bahwa ruang baca sekolah ditutup selamanya karena 80% murid tidak berminat membaca. Namun arsip rapat dan laporan survei tampak tidak sesuai.</p><p>Dalam misi ini kamu akan memisahkan klaim, alasan, dan bukti; membandingkan isinya; lalu menyusun putusan yang dapat dipertanggungjawabkan. Jangan menilai dari bentuk dokumen saja.</p>'}],materi:MAT};

function readGate(id,i){let g=S.gates[id],items=gates[id];if(i>0&&!g.records[i-1]?.done){toast(`Baca ${items[i-1].name} terlebih dahulu`);return}readingCurrent={id,i};g.records[i]||={remaining:lockSec(secs(items[i].content)),done:false};renderStep(view)}

if(n===3)out.innerHTML=`<div class="wrap"><div class="eyebrow">🧭 LANGKAH 3 · PERSIAPAN</div><h1 class="heroTitle">Latihan Penyidik</h1><p class="muted">Pelajari cara memeriksa argumen. Sesudah memahami materi, lakukan latihan singkat pada panel ini.</p>${gateBlock('materi')}<div class="card"><h3>Latihan terbimbing</h3><p>“Semua murid malas membaca,” kata satu orang. Apakah satu pendapat cukup untuk menyimpulkan keadaan semua murid?</p><div class="grid2"><button class="select-card" data-action="practice" data-value="no">Tidak cukup, perlu bukti yang lebih luas.</button><button class="select-card" data-action="practice" data-value="yes">Cukup, karena orang tersebut yakin.</button></div><p id="practiceFeedback" class="muted small">Pilih satu alasan dan baca umpan baliknya.</p></div>${nextButton(3,!!S.gates.materi?.confirmed&&!!S.practice)}</div>`;
if(n===4){let g=S.game,linked=Object.keys(g.linked).length;out.innerHTML=`<div class="gamecol"><div class="gamequestion"><strong>RUANG BUKTI BERLAPIS</strong> · Ketuk dokumen bercahaya di arena, baca isinya, lalu tentukan hubungan dokumen dengan klaim Memo 017. <span class="muted">${linked}/4 hubungan valid</span></div><div class="arena"><canvas id="evidenceCanvas" tabindex="0" aria-label="Peta interaktif empat dokumen. Gunakan tombol Daftar Dokumen jika sulit menunjuk objek."></canvas><div class="arenaHud"><span class="hudpill">✦ ARSIP 17</span><span class="hudpill">BERKAS TERHUBUNG ${linked}/4</span></div><div class="rotate">Putar HP tegak agar nyaman bermain</div></div><div class="gameanswer"><div class="gamehelp" id="gameHint">${g.finished?'Semua berkas telah diverifikasi. Gerbang putusan terbuka!':g.selected?'Hubungkan bukti ini dengan klaim utama.':'Ketuk salah satu dokumen atau pilih lewat tombol akses.'}</div><div class="gameBtns"><button class="btn secondary" data-action="evidenceList">☰ Dokumen</button><button class="btn secondary" data-action="evidenceInfo">📑 Periksa</button><button class="btn secondary" data-action="evidenceMap">⟲ Peta</button></div>${g.finished?`<button class="btn wide" data-action="next" data-from="4">Lanjut ke ${NAMES[5]} →</button>`:''}</div></div>`;return}
if(n===5){let a=S.analysis,caseObj=CASE2[a.index]||null;out.innerHTML=`<div class="wrap"><div class="eyebrow">⚖️ LANGKAH 5 · PENALARAN & BUKTI</div><h1 class="heroTitle">Meja Analisis</h1><p class="muted">Periksa kasus yang berbeda. Apakah klaimnya didukung, dibantah, atau belum cukup bukti?</p><div class="card"><div class="tag">BERKAS ${Math.min(a.index+1,3)} / 3</div>${caseObj?`<h3>${esc(caseObj.title)}</h3><p style="font-size:1.1rem">${esc(caseObj.text)}</p><div class="grid3">${caseObj.opts.map((o,i)=>`<button class="select-card ${mode()==='ez'&&i===caseObj.answer?'correct':''}" data-action="analyze" data-choice="${i}">${esc(o)}</button>`).join('')}</div><p class="muted" id="analysisFeedback">Pilih putusan untuk memperoleh penjelasan.</p>`:`<h3 style="color:var(--good)">Semua berkas analisis telah selesai!</h3><p>Gunakan temuanmu untuk membuat Kartu Putusan pada langkah berikutnya.</p>`}</div>${nextButton(5,a.finished)}</div>`;return}

d small">${p.done?'✅ Kartu Putusan diterima.':''}</div>${nextButton(6,p.done)}</div>`;return}
if(n===7){let b=S.boss;if(!b.queue.length&&!b.cleared)startBossRound();const entry=b.queue[b.index]||null;out.innerHTML=`<div class="gamecol"><div class="gamequestion"><strong>FINAL BOSS · BAYANGAN ARSIP</strong> <span class="muted">${entry?`Serangan ${b.index+1}/${b.queue.length} · ${entry.type==='pgk'?'Pilih semua yang benar':'Pilih satu jawaban'}`:'Pertarungan selesai'}</span></div><div class="arena"><canvas id="bossCanvas" tabindex="0" aria-label="Bayangan Arsip berhadapan dengan podium bukti"></canvas><div class="arenaHud"><span class="hudpill">⚔ ${b.shots} SERANGAN</span><span class="hudpill">BAYANGAN ARSIP · ${b.hp}/10</span></div><div class="rotate">Putar HP tegak agar nyaman bermain</div></div><div class="gameanswer bossAnswer"><div class="hp"><i style="width:${b.hp*10}%"></i></div>${entry&&!b.cleared?`<div class="bossQuestionInline" role="heading" aria-level="3">${esc(entry.q)}</div>`:''}${b.cleared?`<p class="gamewin">🏳️ Bayangan Arsip tumbang! Bukti telah mengalahkan asumsi.</p><button class="btn wide" data-action="next" data-from="7">Lanjut ke ${NAMES[8]} →</button>`:entry?`<div class="bossOptions">${entry.o.map((o,i)=>`<button class="bossOpt ${mode()==='ez'&&(entry.type==='pg'?i===entry.a:entry.a.includes(i))?'correct':''}" data-action="bossOption" data-idx="${i}">${esc(o)}</button>`).join('')}</div><div class="bossrow"><span class="gamehelp" id="bossStatus">${entry.type==='pgk'?'Pilihan jamak · semua harus tepat':'Pilih jawaban, lalu serang'}</span><button class="btn" data-action="bossAttack">⚡ SERANG</button></div>`:`<p>Siap untuk gelombang berikutnya.</p><button class="btn" data-action="bossNextRound">Gelombang Berikutnya</button>`}</div></div>`;return}

// Android-friendly renderer: paint the costly 3D archive ONCE per viewport/scene.
// Rebuild Canvas that changes during a modal instead of retaining stale references.
const BG_CACHE=new Map();

function cachedBG(ctx,w,h,red=false){
 const ww=Math.max(1,Math.round(w)),hh=Math.max(1,Math.round(h));
 const key=`${ww}x${hh}:${red?'red':'normal'}`;
 let img=BG_CACHE.get(key);
 if(!img){
   img=document.createElement('canvas');img.width=ww;img.height=hh;
   const bctx=img.getContext('2d',{alpha:false});
   archiveBG(bctx,ww,hh,0,{red});
   if(BG_CACHE.size>=2)BG_CACHE.delete(BG_CACHE.keys().next().value);
   BG_CACHE.set(key,img);
 }
 ctx.drawImage(img,0,0,w,h);
}
function canvasPrepare(canvas){
 if(!canvas||!canvas.isConnected)return null;
 const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height);
 const dpr=window.SCTGPerformance.size(w,h);
 const pw=Math.max(1,Math.round(w*dpr)),ph=Math.max(1,Math.round(h*dpr));
 if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph}
 let c=canvas.getContext('2d',{alpha:false});
 c.setTransform(dpr,0,0,dpr,0,0);
 return {c,w,h};
}
let drawEpoch=0;
function stopDraw(){drawEpoch++;if(raf)cancelAnimationFrame(raf);raf=0}
function activeCanvas(){

function startDraw(){

 let lastPaint=0, lastRaf=0;
 const epoch=drawEpoch;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const fps=reduced?4:Math.min(window.SCTGPerformance.config.fps,cinema?16:view===1?16:30);
 const interval=1000/fps;
 const run=(ts)=>{
   if(epoch!==drawEpoch)return;
   const rafGap=lastRaf?ts-lastRaf:0;lastRaf=ts;
   if(modalOpen||openDrawer||document.hidden){raf=0;return}
   // Look up the live Canvas each frame. renderStep() can replace it after a modal.
   const cn=activeCanvas();
   if(cn&&(lastPaint===0||ts-lastPaint>=interval)){
     lastPaint=ts;
     const paintStart=performance.now();
     let p=canvasPrepare(cn);
     if(p){
       const t=(reduced||window.SCTGPerformance.mode==='hemat')?0:ts/1000;
       try{
         if(cinema)drawCinema(p.c,p.w,p.h,t);
         else if(view===1)cachedBG(p.c,p.w,p.h,false);
         else if(view===4)drawGame(p.c,p.w,p.h,t);
         else if(view===7)drawBoss(p.c,p.w,p.h,t);
       }catch(err){console.error('LIT10 Canvas drawing error',err);}
       window.SCTGPerformance.observeFrame(performance.now()-paintStart,rafGap);
     }
   }
   if(epoch===drawEpoch)raf=requestAnimationFrame(run);
 };

}
