<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a2a">
<title>Misi Gambut: Menyelamatkan Lahan</title>
<style>
*{box-sizing:border-box}
:root{--aa:1;--pz:1;--base:16px;--hh:64px;
--bg:#f3efe4;--card:#fffdf7;--card2:#f8f4e8;--ink:#1d2a22;--muted:#56665b;--line:#d6cfbd;--brand:#2f6b3f;--brand2:#245431;--gold:#b97a12;
--accent:#1d58a8;--dis-bg:#dcd8cc;--dis-ink:#77736a;--ok:#2e7d4f;--bad:#b3362a;--glass:rgba(255,253,247,.82);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--card:#17231c;--card2:#1c2b22;--ink:#e8efe9;--muted:#a3b3a8;--line:#2e3f34;--brand:#5fae70;--brand2:#3f8a52;--gold:#e3b04b;--accent:#2468c4;--dis-bg:#27312b;--dis-ink:#7b857d;--ok:#5cc88a;--bad:#ff7b6b;--glass:rgba(23,35,28,.84);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1712;--card:#17231c;--card2:#1c2b22;--ink:#e8efe9;--muted:#a3b3a8;--line:#2e3f34;--brand:#5fae70;--brand2:#3f8a52;--gold:#e3b04b;--accent:#2468c4;--dis-bg:#27312b;--dis-ink:#7b857d;--ok:#5cc88a;--bad:#ff7b6b;--glass:rgba(23,35,28,.84);color-scheme:dark}
html{font-size:calc(var(--base)*var(--aa)*var(--pz));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans",system-ui,-apple-system,sans-serif;line-height:1.5;height:100vh;height:100dvh;overflow:hidden}
body.panggung{--base:18px;--hh:56px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h2{font-size:1.45rem;line-height:1.25;margin:.2rem 0 .6rem}
h3{font-size:1.1rem;margin:1rem 0 .4rem}
p{margin:.4rem 0 .7rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
/* header */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:30;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
body.nohdr #hdr{display:none}
.hrow{display:flex;align-items:center;gap:2px;padding:0 6px;height:calc(var(--hh) - 4px)}
.hi{width:40px;height:40px;min-width:40px;border:0;background:transparent;border-radius:10px;font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.hi:hover{background:var(--card2)}
#bAa{font-weight:800;font-size:17px;font-family:Georgia,serif}
body.panggung .hi{width:44px;height:44px;min-width:44px}
.htitle{flex:1;min-width:0;padding:0 6px}
.ht1,.ht2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht1{font-weight:700;font-size:15px}.ht2{font-size:12px;color:var(--muted)}
.hbar{height:4px;background:var(--card2)}.hbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--gold));transition:width .4s}
@media (max-width:420px){.hlbl{display:none}}
/* main */
#main{position:fixed;left:0;right:0;bottom:0;top:var(--hh);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
body.nohdr #main{top:0}
#main.fit{overflow:hidden}
.step{min-height:100%}
[hidden]{display:none!important}
#main.fit .step{height:100%}
.page{padding:14px 14px 28px;max-width:100%}
body.panggung .page{max-width:1100px;margin:0 auto;padding:22px 28px 36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 0 rgba(0,0,0,.03)}
.callout{background:var(--card2);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;margin:10px 0}
.foot{margin-top:24px;text-align:center;font-size:.78rem;color:var(--muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:14px;border:0;background:var(--brand);color:#fff;font-weight:700;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 rgba(0,0,0,.15)}
body.panggung .btn{min-height:56px}
.btn.ghost{background:var(--card2);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.88rem}
.btn.big{font-size:1.08rem;padding:12px 22px}
.btn:disabled{cursor:not-allowed}
.btn.lockbtn{background:var(--accent);color:#fff;transition:background-color .2s,color .2s}
.btn.lockbtn:disabled{background:var(--dis-bg);color:var(--dis-ink);box-shadow:none}
.nextstep{width:100%;margin-top:18px}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;padding:6px;min-height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input:not([type]),input[type=password],input[type=tel],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.fld{display:block;margin:8px 0}.fld>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:#1d2a22;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* drawer */
#drawer{position:fixed;inset:0;z-index:60;pointer-events:none;visibility:hidden;transition:visibility 0s .3s}
#drawer .dbg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:.25s}
#drawer .dpan{position:absolute;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--card);transform:translateX(-102%);transition:transform .28s;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.25)}
#drawer.on{pointer-events:auto;visibility:visible;transition:none}#drawer.on .dbg{opacity:1}#drawer.on .dpan{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.dhead b{font-size:1.05rem}
.dlist{overflow:auto;padding:8px;flex:1}
.ditem{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;background:transparent;border-radius:12px;padding:8px 10px;text-align:left}
.ditem:hover{background:var(--card2)}.ditem.cur{background:var(--card2);outline:2px solid var(--brand)}
.ditem .dn{width:26px;font-weight:800;color:var(--muted)}.ditem .di{font-size:22px}.ditem .dt{flex:1;line-height:1.2}.ditem .dt small{display:block;color:var(--muted)}
.ditem.locked{opacity:.6}
.dprog{padding:10px 14px;border-top:1px solid var(--line);font-size:.9rem}
.mx{border:0;background:var(--card2);width:44px;height:44px;border-radius:12px;font-size:18px;flex:0 0 auto}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(5,12,8,.55);z-index:70;display:grid;place-items:center;padding:14px}
.modal{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:calc(100dvh - 28px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
body.panggung .modal{max-width:720px;font-size:1.05rem}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px 18px}.mhead h3{margin:0}
.mbody{padding:8px 18px 18px}
.pgsec{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.pgsec h4{margin:.2rem 0 .5rem}
.ver{font-size:.78rem;color:var(--muted);text-align:center;margin-top:16px}
/* jeda paham skin: buku catatan patroli */
.modal.jeda{background:#f6ecd2;color:#2c2414;border:2px solid #8a6a32;background-image:repeating-linear-gradient(0deg,transparent 0 29px,rgba(120,90,40,.18) 29px 30px);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 6px 0 0 #b53a2a}
.jp-head{display:flex;align-items:center;gap:10px;padding:16px 18px 6px 22px}
.jp-ico{font-size:30px}.jp-head small{display:block;font-weight:700}.jp-head .ok{color:#1f6b3d}.jp-head .no{color:#a2301f}
.jp-t{margin-left:auto;font-weight:800;font-size:1.1rem;min-width:56px;text-align:right}
.jp-body{padding:4px 22px 6px 26px;font-size:1.05rem;line-height:30px}
.jp-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 16px 22px;gap:10px}
.jp-lv{padding:0 22px 16px}
.modal.jeda .linkbtn{color:#5a4210}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.modal.jeda .chip{background:#fff8e6;border-color:#a88a52;color:#2c2414}.modal.jeda .chip.on{background:#2f6b3f;color:#fff}
/* gate (accordion) */
.gate{padding:14px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gtop h2{margin:0}
.gprog{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:.85rem;color:var(--muted)}
.gprog .bar{flex:1;height:8px;border-radius:9px;background:var(--card2);overflow:hidden}.gprog .bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.gi{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin:8px 0;overflow:hidden}
.gi.open{border-color:var(--brand)}
.gh{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;border:0;background:transparent;padding:8px 12px;text-align:left}
.gic{font-size:26px;width:34px;text-align:center}
.gtt{flex:1;line-height:1.25}.gtt small{display:block;color:var(--muted);font-size:.85rem}
.gst{font-size:20px}
.gb{padding:2px 14px 14px}
.gbh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gtext{font-size:1.02rem}
.gtext .tag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--card2);border:1px solid var(--line);padding:1px 8px;border-radius:999px;margin-bottom:4px}
.gb .gnext{width:100%;margin-top:10px}
.ring{position:relative;width:44px;height:44px;display:inline-grid;place-items:center;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}.rbg{stroke:var(--line)}.rfg{stroke:var(--accent);stroke-dasharray:97.4}
.ring b{font-size:.9rem;position:relative}
.ring.done{font-size:24px}
.gconf{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--card2);margin-top:10px;font-weight:600}
.gconf input{width:26px;height:26px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.gconf.off{color:var(--dis-ink)}
/* Ruang Baca Panggung */
.rr{height:100%;display:flex;gap:18px;padding:16px 22px;justify-content:center}
.rr-side{width:min(740px,100%);display:flex;flex-direction:column;min-height:0}
.rr-list{overflow:auto;min-height:0;flex:0 1 auto}
.rr .gi{margin:6px 0}.rr .gh{min-height:60px}
.rr.reading .rr-side{width:300px;flex:0 0 300px;animation:slideR .3s ease}
.rr.reading .gh{min-height:56px;padding:6px 10px}.rr.reading .gtt small{font-size:.75rem}.rr.reading .gic{font-size:22px}
.rr.reading .gtop h2{font-size:1.05rem}
.rr-panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--brand);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.4);animation:fadeIn .3s ease}
.rp-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rp-tt{flex:1}.rp-tt b{display:block;font-size:1.1rem}.rp-tt span{color:var(--muted)}
.rp-body{flex:1;overflow:auto;padding:18px 26px;font-size:max(18px,1.12rem);line-height:1.6}
.rp-body .gtext{font-size:inherit}
.rp-foot{padding:12px 18px;border-top:1px solid var(--line)}.rp-foot .btn{width:100%}
.rr-side .gafter .nextstep{margin-top:10px}
@keyframes slideR{from{transform:translateX(-40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* game layout: one column three bands */
.step.game{display:flex;justify-content:center;position:relative}
.gcol{display:flex;flex-direction:column;width:100%;height:100%;padding:8px 10px 10px;gap:8px;min-height:0}
body.panggung .gcol{max-width:min(1400px,calc((100dvh - var(--hh) - 210px) * 3));padding:10px 16px 14px}
.band-q{flex:0 0 auto;max-height:22%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;position:relative;font-weight:600;line-height:1.35}
body.panggung .band-q{font-size:max(20px,1.1rem);padding:10px 16px}
.band-q .bq-in{padding-right:4px}
.band-q .bq-small{font-weight:400;font-size:.85em;color:var(--muted);display:block}
.band-q .rw{position:absolute;right:6px;top:6px}
.band-q:has(.rw){padding-right:58px}
.arena{flex:1 1 auto;min-height:240px;position:relative;border-radius:16px;overflow:hidden;background:#20352a;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body.panggung .arena{min-height:200px}
body.lsphone .arena{min-height:110px}
body.lsphone .band-q,body.lsphone .band-a{max-height:30%}
.arena canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.arena .ov{position:absolute;left:0;right:0;top:0;pointer-events:none}
.fbs{position:absolute;left:0;right:0;top:38%;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.fb{background:rgba(10,20,14,.82);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;animation:fbUp 1.6s ease forwards;text-align:center;max-width:92%;font-size:1rem}
.fb.ok{background:rgba(31,107,61,.92)}.fb.no{background:rgba(162,48,31,.92)}
@keyframes fbUp{0%{opacity:0;transform:translateY(14px) scale(.9)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.band-a{flex:0 0 auto;max-height:30%;overflow:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
body.panggung .opts{grid-template-columns:repeat(4,1fr)}
.opt{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;padding:6px 8px;line-height:1.2;position:relative}
body.panggung .opt{min-height:56px}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.ezok{outline:3px dashed var(--gold);outline-offset:-5px}
.ezok::after{content:"✓";position:absolute;top:2px;right:6px;color:var(--gold);font-weight:900}
.pgk{display:grid;grid-template-columns:1fr 1fr 70px;gap:6px}
.pgk .opt{font-size:.86rem;min-height:44px;padding:4px 6px}
.pgk .shoot{flex-direction:column;gap:2px;font-size:.85rem;padding:4px}
.pgk .shoot{grid-row:1/3;grid-column:3;min-height:auto;padding:6px 14px}
body.panggung .pgk{grid-template-columns:repeat(4,1fr) 120px}body.panggung .pgk .opt{font-size:1rem;min-height:56px}body.panggung .pgk .shoot{grid-row:1;grid-column:5}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvrow{display:grid;grid-template-columns:repeat(3,1fr) 1.4fr;gap:8px}
@media (max-width:520px){.lvrow{grid-template-columns:repeat(3,1fr)}.lvrow .go{grid-column:1/4}}
.lv{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;line-height:1.1}
.lv small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.lv.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 18%,var(--card))}
.band-a .nextstep{margin-top:0}
.bossbar{display:flex;align-items:center;gap:8px;margin:8px 10px;background:rgba(8,6,20,.62);color:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:.85rem}
.bossbar .hp{flex:1;height:12px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bossbar .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff6b5a,#c0392b);transition:width .4s}
.rot-hint{display:none}
body.lsphone .step.game .rot-hint{display:block;position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#1d2a22;color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;z-index:5;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
/* cover */
.cover{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover-in{position:relative;width:min(440px,100%);display:flex;flex-direction:column;gap:12px}
body.panggung .cover-in{width:min(980px,100%);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px}
.brand{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.brand .kicker{display:inline-block;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 12px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.brand h1{font-size:clamp(2.4rem,9vw,4.4rem);line-height:1;margin:.4rem 0 .1rem;font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em}
.brand .sub{font-size:1.25rem;margin:0;font-weight:600;color:#ffe2a8}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:16px;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.login label{display:block;font-weight:600;font-size:.9rem;margin:0 0 8px}
.login label input{margin-top:3px}
.login .btn{width:100%;margin-top:6px}
.login .linkbtn{display:block;margin:6px auto 0}
.cfoot{position:relative;grid-column:1/-1;color:#fff;text-align:center;font-size:.78rem;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cfoot .linkbtn{color:#fff;min-height:32px;padding:2px 4px}
#curtain{position:fixed;inset:0;z-index:95;pointer-events:none}
#curtain i{position:absolute;top:0;bottom:0;width:51%;background:linear-gradient(90deg,#173222,#2f6b3f 60%,#1b3b28);transition:transform .45s ease}
#curtain i:first-child{left:0;transform:translateX(-101%)}#curtain i:last-child{right:0;transform:translateX(101%);background:linear-gradient(270deg,#173222,#2f6b3f 60%,#1b3b28)}
#curtain.shut i{transform:none!important}
/* cinematic */
.cine{position:fixed;inset:0;z-index:80;background:#000;color:#fff}
.cine canvas{position:absolute;inset:0;width:100%;height:100%}
.cine-txt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:min(900px,92vw);text-align:center;font-size:clamp(1.25rem,4.2vw,2.3rem);font-weight:700;line-height:1.3;text-shadow:0 2px 14px rgba(0,0,0,.85);opacity:0}
body.panggung .cine-txt{font-size:clamp(1.8rem,3vw,2.8rem)}
.cine-txt.in{animation:beatIn .7s ease forwards}
@keyframes beatIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.cine-bar{position:absolute;top:10px;right:10px;display:flex;gap:8px}
.cbtn{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);color:#fff;font-weight:700}
.cine-cta{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center}
.cine-cta .btn{min-width:240px}
.cine-dots{position:absolute;left:0;right:0;bottom:3%;display:flex;justify-content:center;gap:6px}
.cine-dots i{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.3)}.cine-dots i.on{background:#ffd27a}
@media (prefers-reduced-motion:reduce){.cine-txt.in{animation-duration:.01s}.btn.lockbtn{transition:none}#curtain i{transition-duration:.05s}}
/* tables & forms */
.dt{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
.dt th,.dt td{padding:10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.dt th{background:var(--card2)}.dt td:first-child,.dt th:first-child{text-align:left;font-weight:600}
.dt tr:last-child td{border-bottom:0}
.dt input{min-height:44px;text-align:center;max-width:120px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;min-width:56px;border:0;background:var(--card);font-weight:700}
.seg button.on{background:var(--brand);color:#fff}
.cell-ok{background:color-mix(in srgb,var(--ok) 14%,var(--card))!important}.cell-no{background:color-mix(in srgb,var(--bad) 14%,var(--card))!important}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{border:2px solid var(--line);border-radius:16px;background:var(--card);padding:12px;text-align:left;min-height:72px}
.cc b{display:block;font-size:1.1rem}.cc.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.fbbox{border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600}
.fbbox.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));border:1px solid var(--ok)}
.fbbox.no{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:1px solid var(--bad)}
.fbbox ul{margin:.3rem 0 0;padding-left:1.2rem;font-weight:400}
.denah-wrap{position:relative;height:300px;border-radius:16px;overflow:hidden;background:#d9e7cf;border:1px solid var(--line)}
body.panggung .denah-wrap{height:360px}
.denah-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.rcard{background:linear-gradient(160deg,#fbf6e6,#efe4c4);color:#2c2414;border:2px solid #8a6a32;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.rcard h3{margin:0 0 4px;font-size:1.05rem;letter-spacing:.04em}
.rcard table{width:100%;border-collapse:collapse;margin:8px 0}.rcard td,.rcard th{border:1px solid #b89a5e;padding:6px;text-align:center}
.rcard .al{background:rgba(255,255,255,.55);border-radius:10px;padding:8px;min-height:44px;white-space:pre-wrap}
.checks label{display:flex;gap:10px;align-items:center;min-height:44px}
.checks input{width:24px;height:24px;accent-color:var(--accent)}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;background-image:repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb,var(--line) 70%,transparent) 31px 32px);line-height:32px}
.note p{margin:0 0 32px}.note p:last-child{margin:0}
.pedoman{font-weight:800;color:var(--gold);font-size:1.05rem}
.lockrow{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.emos{display:flex;gap:8px;flex-wrap:wrap}
.emo{font-size:30px;width:58px;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;animation:floaty 2.6s ease-in-out infinite}
.emo:nth-child(2){animation-delay:.3s}.emo:nth-child(3){animation-delay:.6s}.emo:nth-child(4){animation-delay:.9s}.emo:nth-child(5){animation-delay:1.2s}
.emo.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 18%,var(--card));animation:wobble .6s ease}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wobble{0%{transform:rotate(0)}30%{transform:rotate(-10deg) scale(1.1)}60%{transform:rotate(8deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.emo,.emo.on{animation:none}}
.cert{background:linear-gradient(160deg,#fffaf0,#f1e6c8);color:#2c2414;border:6px double #2f6b3f;border-radius:14px;padding:22px 18px;text-align:center}

.cert .code{font-family:ui-monospace,Consolas,monospace;font-weight:700;background:#fff;border:1px dashed #8a6a32;border-radius:8px;padding:2px 8px}
.cert ol{text-align:left;font-size:.9rem;padding-left:1.2rem}
/* presentation */
#presPanel{position:fixed;right:12px;bottom:12px;z-index:65;display:none;gap:8px;background:rgba(20,30,24,.86);padding:8px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
body.pres #presPanel{display:flex}
#presPanel button{min-width:56px;min-height:56px;border-radius:14px;border:0;background:#2f6b3f;color:#fff;font-weight:800;font-size:18px}

@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:600}

let AC=null;

function tone(f,d,{type='sine',v=.14,t0=0,f2=null}={}){const a=ac();if(!a)return;const t=a.currentTime+t0;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}

const Locks=new Set();
class Lock{constructor(total,o){this.rem=total;this.total=total;Object.assign(this,o);Locks.add(this)}stop(){Locks.delete(this)}}
let lastT=performance.now();
setInterval(()=>{const now=performance.now();const dt=Math.min(.5,(now-lastT)/1000);lastT=now;if(document.hidden)return;for(const L of [...Locks]){if(L.active&&!L.active())continue;L.rem-=dt;if(L.rem<=0){L.rem=0;Locks.delete(L);L.onTick&&L.onTick(0);L.onDone&&L.onDone()}else L.onTick&&L.onTick(L.rem)}},200);

function Gate(root,cfg){
 const G=S.gates[cfg.id]||(S.gates[cfg.id]={done:[],rem:{},ok:false});
 const N=cfg.items.length;let curI=-1,lock=null;
 const isDone=i=>G.done.includes(i);
 const firstUndone=()=>{for(let i=0;i<N;i++)if(!isDone(i))return i;return -1};
 const avail=i=>isDone(i)||i===firstUndone();
 const all=()=>firstUndone()===-1;
 const dur=i=>lockSecs(wc(cfg.items[i].body),5);
 const st=i=>isDone(i)?'✅':i===curI?'⏳':avail(i)?'▶':'🔒';
 const nextLabel=i=>i<N-1?`Lanjut ke ${cfg.items[i+1].label} →`:'Selesai Membaca';
 function ring(i){if(isDone(i))return '<span class="ring done" aria-label="Selesai dibaca">✅</span>';const tot=dur(i),r=Math.min(G.rem[i]??tot,tot);return `<span class="ring" data-ring="${i}" aria-label="Waktu baca minimum"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" class="rbg"/><circle cx="18" cy="18" r="15.5" class="rfg" style="stroke-dashoffset:${(97.4*(1-r/tot)).toFixed(1)}"/></svg><b>${Math.ceil(r)}</b></span>`}
 const prog=()=>`<div class="gprog"><div class="bar"><i style="width:${G.done.length/N*100}%"></i></div><span>${G.done.length}/${N} dibaca</span></div>`;
 const head=i=>`<button class="gh" data-open="${i}" aria-expanded="${i===curI}"><span class="gic">${cfg.items[i].icon}</span><span class="gtt"><b>${cfg.items[i].label}</b><small>${cfg.items[i].title}</small></span><span class="gst" data-st="${i}">${st(i)}</span></button>`;
 const conf=()=>`<label class="gconf ${all()?'':'off'}"><input type="checkbox" class="gcb" ${G.ok?'checked':''} ${all()?'':'disabled'}><span>${cfg.confirm}</span></label>`;
 const after=()=>`<div class="gafter">${cfg.after?cfg.after():''}</div>`;
 function draw(){
  if(isPang){root.innerHTML=`<div class="rr ${curI>=0?'reading':'listing'}">${curI>=0?`<div class="rr-panel"><div class="rp-head"><span class="gic">${cfg.items[curI].icon}</span><div class="rp-tt"><b>${cfg.items[curI].label}</b><span>${cfg.items[curI].title}</span></div>${ring(curI)}<button class="mx" data-close aria-label="Tutup bacaan">✕</button></div><div class="rp-body"><div class="gtext">${cfg.items[curI].body}</div></div><div class="rp-foot"><button class="btn lockbtn gnext" data-gn="${curI}" ${isDone(curI)?'':'disabled'}>${nextLabel(curI)}</button></div></div>`:''}<div class="rr-side">${cfg.top||''}${prog()}<div class="rr-list">${cfg.items.map((_,i)=>`<div class="gi ${i===curI?'open':''}">${head(i)}</div>`).join('')}</div>${conf()}${after()}</div></div>`}
  else{root.innerHTML=`<div class="gate acc">${cfg.top||''}${cfg.intro||''}${prog()}${cfg.items.map((it,i)=>`<div class="gi ${i===curI?'open':''}">${head(i)}${i===curI?`<div class="gb"><div class="gbh">${ring(i)}<span class="muted small">Waktu baca minimum</span></div><div class="gtext">${it.body}</div><button class="btn lockbtn gnext" data-gn="${i}" ${isDone(i)?'':'disabled'}>${nextLabel(i)}</button></div>`:''}</div>`).join('')}${conf()}${after()}</div>`}
  cfg.onDraw&&cfg.onDraw();
 }
 function stopLock(){if(lock){Locks.delete(lock);lock=null}save()}
 function open(i){
  if(i===curI){close();return}
  if(!avail(i)){toast(`Baca ${cfg.items[firstUndone()].label} terlebih dahulu`);return}
  sfx('tap');stopLock();curI=i;
  if(!isDone(i)){const tot=dur(i);if(G.rem[i]==null||G.rem[i]>tot)G.rem[i]=tot;
   lock=new Lock(G.rem[i],{active:()=>curI===i&&root.isConnected&&!cineOpen&&modalCount===0,
    onTick:r=>{G.rem[i]=r;save();const el=root.querySelector(`[data-ring="${i}"]`);if(el){el.querySelector('b').textContent=Math.ceil(r);el.querySelector('.rfg').style.strokeDashoffset=(97.4*(1-r/tot)).toFixed(1)}},
    onDone:()=>finish(i)})}
  draw();
 }
 function finish(i){ // Kunci Senyap: tanpa suara/animasi/toast/scroll
  if(!G.done.includes(i))G.done.push(i);delete G.rem[i];lock=null;save();
  const el=root.querySelector(`[data-ring="${i}"]`);if(el)el.outerHTML='<span class="ring done" aria-label="Selesai dibaca">✅</span>';
  const b=root.querySelector(`.gnext[data-gn="${i}"]`);if(b)b.disabled=false;
  $$('[data-st]',root).forEach(s=>s.textContent=st(+s.dataset.st));
  const gp=root.querySelector('.gprog');if(gp)gp.outerHTML=prog();
  if(all()){const cb=root.querySelector('.gcb');if(cb){cb.disabled=false;cb.closest('.gconf').classList.remove('off')}}
 }
 function close(){stopLock();curI=-1;draw()}
 root.onclick=e=>{
  const o=e.target.closest('[data-open]');if(o){open(+o.dataset.open);return}
  if(e.target.closest('[data-close]')){sfx('tap');close();return}
  const n=e.target.closest('.gnext');if(n&&!n.disabled){const i=+n.dataset.gn;if(i<N-1){curI=-1;open(i+1)}else{sfx('tap');close()}}
 };
 root.onchange=e=>{if(e.target.classList.contains('gcb')){G.ok=e.target.checked;save();sfx('tap');cfg.onChange&&cfg.onChange(G.ok)}};
 if(isEZ()&&!all()){/* EZ tetap mengikuti urutan & hitung mundur 2 detik */}
 return{draw,destroy:stopLock,ok:()=>G.ok&&all()};
}

 A.rect(0,0,W,H,{fill:[251,246,232]});A.rect(18,18,W-36,H-36,{stroke:[47,107,63],lw:6});A.rect(30,30,W-60,H-60,{stroke:[185,122,18],lw:1.5});
